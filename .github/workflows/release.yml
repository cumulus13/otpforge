name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$ver" ]; then
            echo "Tag ($tag) does not match Cargo.toml version ($ver)"; exit 1
          fi
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: otpforge $version
          branch: master
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-latest,   target: i686-pc-windows-msvc }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: otpforge,otp
          target: ${{ matrix.target }}
          archive: otpforge-$tag-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE-MIT,LICENSE-APACHE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-android:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android }   # arm64-v8a: most phones, Termux on aarch64
          - { target: armv7-linux-androideabi } # armeabi-v7a: Termux on armv7l / armv8l
          - { target: x86_64-linux-android }    # emulators, Chromebooks
          - { target: i686-linux-android }      # x86 emulators
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure Android NDK
        run: bash .github/scripts/android-env.sh ${{ matrix.target }} 24
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bins
      - name: Package
        run: |
          set -euo pipefail
          name="otpforge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/otpforge" "target/${{ matrix.target }}/release/otp" \
             README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$stage/"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "$stage" .
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist
      - name: Upload to release
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: [upload-assets, upload-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

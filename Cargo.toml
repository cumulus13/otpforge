[package]
name = "otpforge"
version = "0.1.7"
edition = "2021"
rust-version = "1.85"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
description = "2FA/TOTP authenticator and secret key generator: encrypted local vault, otpauth:// URIs, QR codes, backup codes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cumulus13/otpforge"
homepage = "https://github.com/cumulus13/otpforge"
documentation = "https://docs.rs/otpforge"
readme = "README.md"
keywords = ["2fa", "totp", "authenticator", "otp", "cli"]
categories = ["command-line-utilities", "authentication", "cryptography"]
exclude = [".github/", ".gitignore"]

[lib]
name = "otpforge"
path = "src/lib.rs"

[[bin]]
name = "otpforge"
path = "src/main.rs"

[[bin]]
name = "otp"
path = "src/bin/otp.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap-color-help = "0.1.3"
clap-version-flag = "1.0.7"
dirs = "6"
data-encoding = "2"
getrandom = "0.3"
hmac = "0.12"
percent-encoding = "2"
rpassword = "7"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
